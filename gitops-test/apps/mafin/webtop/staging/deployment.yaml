apiVersion: apps/v1
kind: Deployment
metadata:
  name: mafin-webtop
  namespace: mafin
  labels:
    app: mafin-webtop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mafin-webtop
  template:
    metadata:
      labels:
        app: mafin-webtop
    spec:
      containers:
        - name: mafin-webtop
          # Version and digest come from kustomization.yaml.
          image: public.ecr.aws/nginx/nginx
          ports:
            - name: http
              containerPort: 80
